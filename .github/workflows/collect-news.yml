name: Collect news
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      verify_gemini:
        description: 'One real Gemini Free Tier check on a public podelu.by article (requires a key from a project without billing)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: marketing-hub-collector
  cancel-in-progress: false
jobs:
  collect:
    if: vars.COLLECTOR_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Configure collector credential
        id: credentials
        run: python scripts/actions_credentials.py
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
      - run: python scripts/run_collector.py
        if: steps.credentials.outputs.enabled == 'true' && !inputs.verify_gemini
        env:
          PYTHONUTF8: '1'
          HUB_BASE_URL: ${{ vars.HUB_BASE_URL || 'https://kimbazirmambe.pythonanywhere.com' }}
          MARKETING_GEMINI_KEY: ${{ secrets.MARKETING_GEMINI_KEY }}
      - name: Verify free AI on a public article
        if: github.event_name == 'workflow_dispatch' && inputs.verify_gemini
        run: python scripts/verify_gemini.py --models-only
        env:
          PYTHONUTF8: '1'
          MARKETING_GEMINI_KEY: ${{ secrets.MARKETING_GEMINI_KEY }}
